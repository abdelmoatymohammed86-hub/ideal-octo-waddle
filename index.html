<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixTech - مشغل أعطال</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9480f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FixTech">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1c1e24;--mute:#7b808c;--line:#e3e5ea;--chip:#e9ebef;--accent:#d9480f;--warn:#e8890c;--danger:#e03131;--ok:#2f9e44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:17px}
.app{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:22px 0 6px}
h1{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px}
h1 .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center}
h1 small{font-size:14px;font-weight:600;color:var(--mute)}
.sub{color:var(--mute);margin:8px 0 14px;font-size:15px}
.search{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:18px;font:inherit;background:var(--card);color:var(--ink)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:30px;padding:12px 20px;background:var(--chip);color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap;direction:ltr}
.chip.ar{direction:rtl}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.count{color:var(--mute);font-size:15px;margin:2px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden}
.head{width:100%;display:flex;align-items:center;gap:10px;padding:18px;background:none;border:0;font:inherit;color:inherit;text-align:start;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.title{flex:1;font-weight:700;line-height:1.5}
.title bdi{direction:ltr}
.tag{background:var(--chip);color:var(--mute);border-radius:12px;padding:4px 12px;font-size:14px;direction:ltr}
.arrow{color:var(--mute);font-size:12px;transition:transform .2s}
.card.open .arrow{transform:rotate(180deg)}
.body{display:none;padding:0 18px 20px}
.card.open .body{display:block}
.sev{display:inline-block;color:#fff;border-radius:16px;padding:7px 16px;font-size:15px;margin:4px 0 6px}
.body h3{color:var(--accent);margin:18px 0 6px;font-size:18px}
.body ul{margin:0;padding-inline-start:22px}
.body li{margin:7px 0;line-height:1.7}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.todo{color:var(--mute);font-size:15px;margin:10px 0 0}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:22px}
</style>
</head>
<body>
<div class="app">
<header>
  <h1><span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></span>FixTech <small>مشغل أعطال</small></h1>
  <p class="sub">اكتب العَرَض أو المشكلة وشوف السبب والحل</p>
  <input id="q" class="search" type="search" placeholder="ابحث عن: سويتش، ريليه، سلونيد..." autocomplete="off" aria-label="بحث">
</header>
<div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div class="foot">FixTech · يعمل بدون إنترنت</div>
</div>

<script>
/* ===== بيانات الأعطال — أضف أي عطل جديد هنا =====
   cat: التصنيف (يجب أن يكون في CATEGORIES)
   code: الرمز الصغير الظاهر في البطاقة
   level: ok | warn | danger   (لون النقطة)
   status / causes / fix: قوائم نقاط
*/
const CATEGORIES = ["Incl","Relay Tsk","Relay Encl","Sensor Color","Vac"];  // أضف خانات جديدة هنا

const FAULTS = [
  { id:1, cat:"Incl", code:"Encl", level:"warn",
    title:"سويتش الـ Encl",
    status:["لابد من سلامة الكابل","جميع أطراف التوصيل جيدة"],
    causes:["قطع في الليد الموصل","كسر الكابل","السويتش stuck"],
    fix:[] },
  { id:2, cat:"Incl", code:"Encl", level:"danger", title:"بروب الـ Encl" },
  { id:3, cat:"Incl", code:"Encl", level:"warn",   title:"ريليهات الـ Encl" },
  { id:4, cat:"Incl", code:"Encl", level:"ok",     title:"سلونيد الـ Encl" },
  { id:5, cat:"Incl", code:"DIODE", level:"warn",  title:"دايود" },
  { id:6, cat:"Incl", code:"Air", level:"ok",      title:"سلونيد الـ Air" },
  { id:7, cat:"Incl", code:"Air", level:"ok",      title:"وصلة الـ Air" }
];
/* ================================================= */

const COLORS = {ok:"#2f9e44", warn:"#e8890c", danger:"#e03131"};
const LABELS = {ok:"الخطورة: منخفضة", warn:"الخطورة: متوسطة", danger:"الخطورة: عالية"};
let activeCat = "ALL", query = "", openId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");

function renderChips(){
  const all = [["ALL","الكل",true], ...CATEGORIES.map(c => [c,c,false])];
  $("#chips").innerHTML = all.map(([v,l,ar]) =>
    `<button class="chip ${ar?'ar':''}" data-v="${esc(v)}" aria-pressed="${v===activeCat}">${esc(l)}</button>`).join("");
}
function section(title, arr){
  return arr && arr.length ? `<h3>${title}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
}
function render(){
  const nq = norm(query.trim());
  const rows = FAULTS.filter(f => (activeCat==="ALL" || f.cat===activeCat) &&
    (!nq || norm([f.title,f.code,f.cat,...(f.status||[]),...(f.causes||[]),...(f.fix||[])].join(" ")).includes(nq)));
  $("#count").textContent = rows.length + " نتيجة";
  $("#list").innerHTML = rows.length ? rows.map(f => {
    const open = f.id===openId;
    const has = (f.status&&f.status.length)||(f.causes&&f.causes.length)||(f.fix&&f.fix.length);
    return `<article class="card ${open?'open':''}">
      <button class="head" data-id="${f.id}" aria-expanded="${open}">
        <span class="dot" style="background:${COLORS[f.level]||COLORS.warn}"></span>
        <span class="title">${esc(f.title)}</span>
        <span class="tag">${esc(f.code||"")}</span>
        <span class="arrow">▼</span>
      </button>
      <div class="body">
        <span class="sev" style="background:${COLORS[f.level]||COLORS.warn}">${LABELS[f.level]||LABELS.warn}</span>
        ${has ? section("الحالة",f.status)+section("الأسباب المحتملة",f.causes)+section("الحل المقترح",f.fix)
              : `<p class="todo">لم تُضف تفاصيل هذا العطل بعد.</p>`}
      </div></article>`;
  }).join("") : `<div class="empty">لا توجد نتائج. جرّب كلمة أخرى أو اختر «الكل».</div>`;
}
$("#chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; activeCat=b.dataset.v; openId=null; renderChips(); render(); });
$("#list").addEventListener("click", e => { const b=e.target.closest(".head"); if(!b) return; const id=+b.dataset.id; openId = openId===id?null:id; render(); });
$("#q").addEventListener("input", e => { query=e.target.value; openId=null; render(); });
renderChips(); render();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
