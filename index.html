<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>FixTech - مشغل أعطال</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FixTech">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#030b1a;--ink:#e9f4ff;--mute:#8fb0d4;--cy:#19d3ff;--paper:#faf5e6;--sub:#d9480f;--warn:#e8890c;--danger:#e03131;--ok:#2f9e44;--accent:#0b6fd6;--accent-d:#083a7d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#030b1a}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;background:transparent;color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:17px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 50% -80px,rgba(25,211,255,.22),transparent 62%),linear-gradient(rgba(25,211,255,.04) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,rgba(25,211,255,.04) 1px,transparent 1px) 0 0/36px 36px,#030b1a}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
header.top{position:relative;background:linear-gradient(180deg,#123a78 0%,#0a2556 55%,#071a3a 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 0 24px;border-radius:0 0 28px 28px;border-bottom:1px solid rgba(25,211,255,.55);box-shadow:0 10px 30px rgba(0,170,255,.28),inset 0 1px 0 rgba(255,255,255,.14)}
h1{margin:0;font-size:27px;font-weight:800;display:flex;align-items:center;gap:12px;letter-spacing:.4px;min-width:0}
h1 .fx{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
h1 .tc{color:var(--cy);text-shadow:0 0 14px rgba(25,211,255,.7),0 2px 0 rgba(0,0,0,.3)}
h1 .logo{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#38e6ff,#0a6fd8);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 14px rgba(25,211,255,.5),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.25)}
h1 small{font-size:14px;font-weight:600;color:rgba(190,222,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{color:rgba(205,228,255,.9);margin:8px 0 16px;font-size:15px}
.sbox{display:flex;align-items:center;background:#061630;border:1px solid rgba(25,211,255,.45);border-radius:14px;box-shadow:inset 0 3px 8px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.08);transition:box-shadow .15s,border-color .15s}
.sbox:focus-within{border-color:var(--cy);box-shadow:inset 0 3px 8px rgba(0,0,0,.65),0 0 0 3px rgba(25,211,255,.25),0 0 20px rgba(25,211,255,.38)}
.sbox .ico{margin-inline-start:14px;color:var(--cy);flex:none;display:grid}
.search{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:14px 12px;color:#fff}
.search::placeholder{color:#6f93bb}
#clr{margin-inline-end:10px;flex:none;border:0;background:#12315f;color:#9fc4ea;width:28px;height:28px;border-radius:50%;font-size:19px;line-height:1;display:none;cursor:pointer}
.sbox.has #clr{display:block}
input[type=search]::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:10px;overflow-x:auto;margin:-4px -16px -6px;padding:24px 18px 22px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.off{opacity:.45}
.chip{flex:none;border:1px solid rgba(25,211,255,.35);border-bottom:3px solid #040f26;border-radius:30px;padding:9px 20px;background:linear-gradient(#1a4586,#0d2a57);color:#dff3ff;font:inherit;font-size:16px;cursor:pointer;white-space:nowrap;direction:ltr;box-shadow:0 5px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.ar{direction:rtl}
.chip:active{transform:translateY(2px);border-bottom-width:1px;margin-bottom:2px}
.chip[aria-pressed=true]{background:linear-gradient(#3fe6ff,#0aa6e6);border-color:#8ff2ff;border-bottom-color:#0576a8;color:#021226;font-weight:700;box-shadow:0 0 18px rgba(25,211,255,.55),0 5px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.65)}
.count{color:var(--mute);font-size:14.5px;margin:2px 4px 10px}
.card{background:linear-gradient(180deg,#10305f 0%,#0a2048 100%);border:1px solid rgba(25,211,255,.28);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 14px 28px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.10)}
.head{width:100%;display:flex;align-items:center;gap:10px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0));border:0;font:inherit;color:var(--ink);text-align:start;cursor:pointer}
.card.open .head{border-bottom:1px solid rgba(25,211,255,.25)}
.dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.16),0 0 10px rgba(255,255,255,.22)}
.title{flex:1;font-weight:800;line-height:1.5;color:#f4faff}
.tag{background:rgba(25,211,255,.12);border:1px solid rgba(25,211,255,.4);color:#8eeaff;border-radius:10px;padding:3px 11px;font-size:13.5px;font-weight:600;direction:ltr}
.arrow{color:var(--cy);font-size:12px;transition:transform .2s}
.card.open .arrow{transform:rotate(180deg)}
.body{display:none;margin:14px;padding:6px 18px 20px;background:var(--paper);color:#141a26;border:1.5px solid #b5ac92;border-radius:12px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px #e1d8bd,0 8px 18px rgba(0,0,0,.45)}
.card.open .body{display:block}
.sev{display:inline-block;color:#fff;border-radius:14px;padding:6px 15px;font-size:14.5px;font-weight:600;margin:12px 0 4px}
.body h3{color:var(--sub);margin:22px 0 8px;font-size:18.5px;font-weight:800;padding-bottom:5px;border-bottom:2px solid #ecd3c1}
.body h4{margin:16px 0 4px;font-size:16.5px;color:#0a2a5c}
.body p{margin:6px 0;line-height:1.85}
.body ul,.body ol{margin:0;padding-inline-start:24px}
.body li{margin:7px 0;line-height:1.75}
.body li::marker{color:#0b6fd6}
.note{background:#fff3df;border:1px solid #efd3a2;border-inline-start:4px solid #e8890c;border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.7;margin:12px 0}
.note.hint{background:#e8f4ff;border-color:#b9dcf7;border-inline-start-color:#0b6fd6}
figure{margin:14px 0}
figure img{width:100%;display:block;border-radius:10px;border:1px solid #d6cdb3;padding:5px;cursor:zoom-in;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
figcaption{font-size:13px;color:#6b6a65;text-align:center;margin-top:7px}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:8px 0;padding:12px 16px;border:0;border-bottom:3px solid #0576a8;border-radius:12px;background:linear-gradient(#3fe6ff,#0aa6e6);color:#021226;font:inherit;font-weight:700;line-height:1.5;cursor:pointer;text-align:start;box-shadow:0 6px 12px rgba(0,120,190,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.lnk:active{transform:translateY(2px);border-bottom-width:1px}
.lnk .go{font-size:22px;line-height:1;flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.todo{color:#6b6a65;font-size:15px;margin:10px 0 0}
.foot{text-align:center;color:#5f7fa6;font-size:13px;margin-top:24px}
.nav{display:flex;gap:8px;flex:none}
.nbtn{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(25,211,255,.4);border-bottom-width:3px;background:linear-gradient(#1a4586,#0d2a57);color:#7fe6ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.nbtn svg{width:23px;height:23px}
.nbtn.back svg{transform:scaleX(-1)}
.nbtn:not(:disabled):active{transform:translateY(2px);border-bottom-width:1px}
.nbtn:disabled{opacity:.32;cursor:default}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9;align-items:center;justify-content:center;padding:12px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
@media (max-width:820px){.wrap,.app{max-width:none}}
@media (max-width:420px){.nbtn{width:36px;height:36px}.nav{gap:6px}h1{font-size:24px;gap:8px}h1 small{font-size:13px}.nbtn svg{width:21px;height:21px}}
@media (max-width:340px){h1 small{display:none}}
/* ---- شاشة البداية: تملأ الشاشة كاملة ---- */
#splash{position:fixed;inset:0;z-index:99;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#0b2a5c 0%,#040f26 62%,#02060f 100%);transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
#splash .sp-port{display:none}
#splash .sp-bar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);left:50%;width:min(60vw,260px);height:4px;margin-left:calc(min(60vw,260px)/-2);border-radius:4px;background:rgba(25,211,255,.18);overflow:hidden;z-index:3}
#splash .sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0aa6e6,#6ff0ff);box-shadow:0 0 12px #19d3ff;animation:spbar 2.4s ease-out forwards}
@keyframes spbar{to{width:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (orientation:portrait){
 #splash .sp-img{object-position:14% 50%;transform:scale(1.2);filter:blur(10px) brightness(.5) saturate(1.15)}
 #splash::after{content:"";position:absolute;inset:0;z-index:1;background:#0a3f96;mix-blend-mode:color;opacity:.9;pointer-events:none}
 #splash .sp-port{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,14px);padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 44px)}
 #splash .sp-port>*{opacity:0;animation:spin-in .7s ease forwards}
 #splash .sp-port>:nth-child(2){animation-delay:.12s}#splash .sp-port>:nth-child(3){animation-delay:.24s}#splash .sp-port>:nth-child(4){animation-delay:.3s}#splash .sp-port>:nth-child(5){animation-delay:.4s}
 .sp-logo{width:min(36vw,17vh,170px);aspect-ratio:1;filter:drop-shadow(0 0 10px rgba(25,211,255,.75))}
 .sp-logo svg{width:100%;height:100%;display:block}
 .sp-logo .gear{transform-origin:100px 100px;animation:spin 18s linear infinite}
 .sp-title{font:900 clamp(38px,11.5vw,62px)/1 "Segoe UI",Arial,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(255,255,255,.25)}
 .sp-title b{color:#2fdcff;font-weight:900;text-shadow:0 0 18px rgba(25,211,255,.85),0 3px 0 rgba(0,0,0,.4)}
 .sp-tag{font-size:clamp(18px,5.4vw,26px);font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
 .sp-line{width:min(70vw,320px);height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#19d3ff,transparent);box-shadow:0 0 14px #19d3ff}
 .sp-panel{width:min(90vw,430px);margin-top:clamp(2px,1vh,10px);padding:14px 16px 12px;border:1.5px solid rgba(25,211,255,.8);border-radius:20px;background:linear-gradient(180deg,rgba(9,44,98,.78),rgba(4,18,46,.88));box-shadow:0 0 24px rgba(25,211,255,.45),inset 0 0 26px rgba(25,211,255,.14),0 14px 30px rgba(0,0,0,.55);text-align:center;direction:rtl}
 .sp-panel hr{border:0;border-top:1.5px dotted rgba(160,210,255,.5);margin:clamp(6px,1.2vh,11px) 0}
 .sp-sec{display:flex;justify-content:flex-start;margin-bottom:4px}
 .sp-sec .pill{display:inline-flex;align-items:center;gap:7px;padding:4px 14px;border-radius:999px;background:rgba(25,211,255,.16);border:1px solid rgba(25,211,255,.6);color:#7fe6ff;font-weight:700;font-size:clamp(14px,4vw,17px)}
 .sp-sec .pill svg{width:17px;height:17px}
 .sp-name{font-size:clamp(20px,6vw,26px);font-weight:800;color:#fff;line-height:1.6}
 .sp-ln{font-size:clamp(15px,4.4vw,19px);font-weight:600;color:#fff;line-height:1.85}
}
@media (orientation:portrait) and (max-height:700px){.sp-ln{line-height:1.6}.sp-panel{padding:10px 14px 8px}}
</style>
</head>

{ id:8, cat:"Power TSK", code:"TSK", level:"info", title:"CIRCUIT POWER TSK — دليل توصيلات دوائر الباور لنظام TSK Test Board",
  blocks:[
    {h:"1) مصدر الكهرباء الرئيسي"},
    {p:"نقطة بداية التغذية الكهربائية للنظام."},
    {ul:["الجهد: 220V"]},
    {img:"img-power-supply.webp", cap:"كابل 220V الداخل وروزتة الخروج (DC): كابلان أزرق موجب (+) ومخرج أرضي أبيض في أزرق (-)"},

    {h:"2) وسائل الحماية والأمان"},
    {ul:["المكوّن: سكينة حماية / مفتاح مقاوم للتسريب الكهربي (Circuit Breaker / RCD).",
         "مسؤول عن حماية النظام بالكامل وفصل التيار في حال حدوث أي تسريب أو خطر كهربائي."]},

    {h:"3) وحدات إمداد الطاقة (Power Supply Box)"},
    {p:"بوكس الـ Power Supply يحتوي على وحدتي إمداد طاقة منفصلتين:"},
    {ul:["Power Supply 24V","Power Supply 12V"]},

    {h:"4) نقطة الحماية العامة (General Fuses)"},
    {p:"نقاط حماية وقواطع لكابلات الأطراف الموجبة فقط (+24V و +12V)."},
    {ul:["Fuse 2A: مخصص لكل خط خارج من الـ Power Supply ومتجه إلى كارتات الـ Sleeve.",
         "Fuse 5A: مخصص فقط لمسار الكارت الرئيسي (Master Card)."]},

    {h:"5) نقطة توزيع الأرضي (Terminal Blocks / روزتات التوزيع)"},
    {p:"نقاط مخصصة لتجميع وتوزيع كابلات الأرضي (Ground) لضمان استقرار النظام الكهربائي."},

    {h:"6) كارت الريلاي الرئيسي (Master Card)"},
    {p:"بمثابة وحدة تحويل ومشترك رئيسي يربط بين الأجزاء المختلفة:"},
    {ul:["يجمع كهرباء 5V القادمة من الـ Rack من خلال كابل الريلاي (Relays Cable).",
         "يربط مع الكهرباء الخارجة من الـ Power Supply (24V و 12V).",
         "يقوم بتوزيع هذه الفولتات على كارتات الـ PCB من خلال الـ Bridge."]},
    {p:"الهدف من وجود الـ Master & Sleeve Cards: توزيع الأحمال بكفاءة على جميع كارتات الـ PCB."},
    {img:"img-master-card.webp", cap:"كارت الماستر (Master Card)"},

    {h:"7) كارتات التوزيع الفرعية (PCB Cards & Sleeve Cards)"},
    {p:"كارتات الـ PCB ومجموعات الـ Sleeve مسؤولة عن توزيع الكهرباء النهائية لموديلات الـ TSK."},
    {img:"img-sleeve-card.webp", cap:"كارت الـ Sleeve"},
    {sub:"كابل البيانات (Data Cable)"},
    {ul:["التوصيل: متصل من الـ Master Card إلى جميع كارتات الـ Sleeve الموجودة.",
         "الغرض: توزيع الكهرباء الخارجة من الـ Rack إلى سويتشات الموديولات."]},

    {h:"ملحقات ومكونات إضافية بدوائر Power الـ TSK"},

    {sub:"أ) الـ Bridge (كوبري التوصيل)"},
    {p:"وسيلة لتوصيل ونقل الكهرباء من الـ Master Card أو الـ Sleeve Card إلى كارت الـ PCB."},
    {img:"img-bridge.webp", cap:"الـ Bridge (كوبري التوصيل)"},

    {sub:"ب) كابل الريلاي (Relays Cable)"},
    {ul:["عبارة عن سويتش بنظام Normally Closed (مغلق في الوضع الطبيعي).",
         "الوظيفة: يوزع كهرباء الـ 5V القادمة من الـ Rack إلى الـ PCB من خلال كارت الإدخال/الإخراج (In/Out Port) داخل الراك.",
         "التثبيت: يتم تثبيته في الراك حسب الـ Port المعرف في برنامج الـ Test (سواء 1 Port أو 2 Port)."]},

    {sub:"ج) كابل القفل (Lock Cable)"},
    {img:"img-lock-cable.webp", cap:"كابل القفل (TEST LOCK)"},
    {p:"الوظيفة الأساسية:"},
    {ul:["تثبيت الهارنس على بورد التيست لحين إتمام مراحل الاختبار وخروج الـ Label.",
         "ضمان عدم التلاعب في البيانات (Data) الخاصة بكل هارنس أو طريقة الفحص، ومطابقة البيانات مع نظام LMS."]},
    {p:"طريقة التوصيل (خطوات):"},
    {ol:["اختيار الـ Detection المناسب.",
         "قطع كابلي هذا الـ Detection.",
         "توصيل IHS Connector Female بالكابل الواصل للـ Detection في الموديول (يمثل الـ Input).",
         "توصيل IHS Connector Male بالكابل الواصل لنقطة الاختبار (Test Point) في الـ PCB.",
         "توصيل كابل اللوك في الراك حسب تعريفه داخل البرنامج."]}
  ]}
];

const COLORS = {ok:"#2f9e44", warn:"#e8890c", danger:"#e03131", info:"#0b7bd6"};
const LABELS = {ok:"الخطورة: منخفضة", warn:"الخطورة: متوسطة", danger:"الخطورة: عالية", info:"دليل توصيلات"};
let activeCat = "ALL", query = "", openId = null, autoOpen = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/چ/g,"ج").replace(/ڤ/g,"ف").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
const textOf = f => [f.title,f.code,f.cat,...(f.models||[]),...(f.keywords||[]),...(f.blocks||[]).flatMap(b=>[b.h,b.sub,b.p,b.note,b.link,b.cap,...(b.ul||[]),...(b.ol||[])])].filter(Boolean).join(" ");

/* ---- محرك البحث: يبحث في كل الأقسام ويفهم الجمع والمرادفات ---- */
const STOP = new Set(["ال","اعطال","عطل","اعراض","عرض","مشكله","حل","سبب","في","من","علي","على","عن","ب","ل"]);
const MAP = {"سويش":"سويتش","سوتش":"سويتش","switch":"سويتش","switches":"سويتش","ريلاي":"ريليه","ريلي":"ريليه","relay":"ريليه",
  "سولينويد":"سلونيد","سولنويد":"سلونيد","solenoid":"سلونيد","probe":"بروب","diode":"دايود","دايوت":"دايود",
  "جيك":"جيك","جاك":"جيك","jack":"جيك","موديول":"جيك","مديول":"جيك","module":"جيك",
  "fuse":"فيوز","fuses":"فيوز","lock":"لوك","card":"كارت","cards":"كارت","power":"باور","باوور":"باور"};
const stem = t => { t=norm(t); if(t.length>3 && t.startsWith("ال")) t=t.slice(2); if(t.length>4 && t.endsWith("ات")) t=t.slice(0,-2); return MAP[t]||t; };
const NEG = new Set(["لا","ما","مش","لم","عدم"]);
const toks = s => {
  const out=[]; let neg=false;
  for(const w of (s.match(/[\p{L}\p{N}]+/gu)||[])){
    const n=norm(w);
    if(NEG.has(n)){ neg=true; continue; }
    if(/قفل|غلق/.test(n)) out.push(neg || /ش$/.test(n) ? "لاغلق" : "غلق");   // لا يغلق / ما بتقفلش / مش بيقفل
    else out.push(stem(w));
    neg=false;
  }
  return out;
};
const qTokens = s => toks(s).filter(t => t && !STOP.has(t));
const idx = f => f._i || (f._i = {all:toks(textOf(f)).join(" "), title:toks(f.title).join(" ")});
function score(f,qt){ const i=idx(f); let s=0; for(const t of qt){ if(i.title.includes(t)) s+=3; else if(i.all.includes(t)) s+=1; else return 0; } return s; }

function renderBlocks(arr){
  return arr.map(b =>
    b.h   ? `<h3>${esc(b.h)}</h3>` :
    b.sub ? `<h4>${esc(b.sub)}</h4>` :
    b.p   ? `<p>${esc(b.p)}</p>` :
    b.link? `<button class="lnk" type="button" data-to="${+b.to}"><span>${esc(b.link)}</span><span class="go" aria-hidden="true">‹</span></button>` :
    b.note? `<div class="note${b.hint?" hint":""}">${esc(b.note)}</div>` :
    b.ul  ? `<ul>${b.ul.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` :
    b.ol  ? `<ol>${b.ol.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>` :
    b.img ? `<figure><img ${b.w?`style="width:${esc(b.w)};margin:0 auto"`:""} src="${esc(IMGS[b.img]||b.img)}" alt="${esc(b.cap||"")}" loading="lazy">${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:""}</figure>` : ""
  ).join("");
}
function renderChips(){
  const all = [["ALL","الكل",true], ...CATEGORIES.map(c => [c,c,false])];
  $("#chips").innerHTML = all.map(([v,l,ar]) =>
    `<button class="chip ${ar?'ar':''}" data-v="${esc(v)}" aria-pressed="${v===activeCat}">${esc(l)}</button>`).join("");
}
function render(){
  const qt = qTokens(query), searching = qt.length>0;
  const rows = searching
    ? FAULTS.map(f=>({f,s:score(f,qt)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.f.id-b.f.id).map(x=>x.f)
    : FAULTS.filter(f => activeCat==="ALL" || f.cat===activeCat);
  if(autoOpen){ if(searching && rows.length===1) openId=rows[0].id; autoOpen=false; }
  $("#chips").classList.toggle("off",searching);
  $("#count").textContent = rows.length + " نتيجة" + (searching ? " في كل الأقسام" : "");
  $("#list").innerHTML = rows.length ? rows.map(f => {
    const open = f.id===openId;
    return `<article class="card ${open?'open':''}">
      <button class="head" data-id="${f.id}" aria-expanded="${open}">
        <span class="dot" style="background:${COLORS[f.level]||COLORS.warn}"></span>
        <span class="title">${esc(f.title)}</span>
        <span class="tag">${esc(f.code||"")}</span>
        <span class="arrow">▼</span>
      </button>
      <div class="body">
        <span class="sev" style="background:${COLORS[f.level]||COLORS.warn}">${LABELS[f.level]||LABELS.warn}</span>
        ${f.models&&f.models.length ? renderBlocks([{h:"الموديلات"},{ul:f.models}]) : ""}
        ${f.blocks&&f.blocks.length ? renderBlocks(f.blocks) : `<p class="todo">لم تُضف تفاصيل هذا العطل بعد.</p>`}
      </div></article>`;
  }).join("") : `<div class="empty">لا توجد نتائج. جرّب كلمة أخرى أو اختر «الكل».</div>`;
}
$("#chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; activeCat=b.dataset.v; openId=null; query=""; $("#q").value=""; $("#sbox").classList.remove("has"); renderChips(); render(); commit(); });
$("#list").addEventListener("click", e => {
  const im=e.target.closest("figure img");
  if(im){ $("#lb img").src=im.src; $("#lb").classList.add("on"); return; }
  const lk=e.target.closest(".lnk");
  if(lk){ openCard(+lk.dataset.to); return; }
  const b=e.target.closest(".head"); if(!b) return; const id=+b.dataset.id; openId = openId===id?null:id; render(); commit();
});
$("#lb").addEventListener("click", () => $("#lb").classList.remove("on"));
let qTimer;
$("#q").addEventListener("input", e => { query=e.target.value; openId=null; autoOpen=true; $("#sbox").classList.toggle("has",!!query); render(); clearTimeout(qTimer); qTimer=setTimeout(commit,700); });
$("#clr").addEventListener("click", () => { query=""; openId=null; $("#q").value=""; $("#sbox").classList.remove("has"); render(); commit(); $("#q").focus(); });

function openCard(id){
  const f=FAULTS.find(x=>x.id===id); if(!f) return;
  const y=window.scrollY||0;
  activeCat=f.cat; query=""; openId=id; $("#q").value=""; $("#sbox").classList.remove("has");
  renderChips(); render(); commit(y);
  const el=document.querySelector('.head[data-id="'+id+'"]'); if(el) el.scrollIntoView({block:"start"});
}

/* ---- التنقل: صفحة سابقة / تالية (يعمل مع زر الرجوع في الموبايل أيضًا) ---- */
const hist = {states:[], i:0, ok:true};
const snap = () => ({cat:activeCat, open:openId, q:query, y:window.scrollY||0});
function navUI(){ $("#navBack").disabled = hist.i<=0; $("#navFwd").disabled = hist.i>=hist.states.length-1; }
function applyState(st){
  activeCat=st.cat; openId=st.open; query=st.q;
  $("#q").value=query; $("#sbox").classList.toggle("has",!!query);
  renderChips(); render(); window.scrollTo(0,st.y||0); navUI();
}
function commit(prevY){
  const cur=hist.states[hist.i], st=snap();
  cur.y = prevY!=null ? prevY : st.y;
  if(cur.cat===st.cat && cur.open===st.open && cur.q===st.q){ navUI(); return; }
  hist.states=hist.states.slice(0,hist.i+1); hist.states.push(st); hist.i++;
  try{ history.pushState({i:hist.i},""); }catch(e){ hist.ok=false; }
  navUI();
}
function go(d){
  const n=hist.i+d; if(n<0 || n>=hist.states.length) return;
  hist.states[hist.i].y=window.scrollY||0;
  hist.i=n; applyState(hist.states[n]);
  if(hist.ok){ try{ history.go(d); }catch(e){} }
}
$("#navBack").addEventListener("click", () => go(-1));
$("#navFwd").addEventListener("click", () => go(1));
addEventListener("popstate", e => {
  const n = e.state && typeof e.state.i==="number" ? e.state.i : null;
  if(n===null || n===hist.i || !hist.states[n]) return;
  hist.states[hist.i].y=window.scrollY||0; hist.i=n; applyState(hist.states[n]);
});
try{ history.scrollRestoration="manual"; history.replaceState({i:0},""); }catch(e){ hist.ok=false; }

/* ---- ملء الشاشة: لو فتح المتصفح الصفحة بعرض أكبر من الشاشة (وضع الكمبيوتر) نكبّرها لتناسب الشاشة ---- */
(function fit(){
  try{
    const sw=screen.width, iw=window.innerWidth;
    if(matchMedia("(pointer:coarse)").matches && sw && iw>600 && iw>sw*1.25) document.documentElement.style.zoom=(iw/sw).toFixed(3);
  }catch(e){}
})();

renderChips(); render();
hist.states=[snap()]; navUI();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
